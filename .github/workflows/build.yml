name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build self-contained executable
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Self-test
        shell: pwsh
        run: |
          & .\dist\GS1LabelPrinter.exe --selftest .\samples
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: GS1LabelPrinter-win-x64
          path: dist/GS1LabelPrinter.exe
          if-no-files-found: error
